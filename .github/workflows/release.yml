name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: |
          NAME=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'val appVersionCode = \K[0-9]+' app/build.gradle.kts)
          UNDER=$(echo "$NAME" | tr '.' '_')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}-build${CODE}" >> "$GITHUB_OUTPUT"
          echo "apk=LiquidBaby-${UNDER}-build${CODE}.apk" >> "$GITHUB_OUTPUT"

      - name: Stop if this build number was already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.ver.outputs.tag }} already exists. Increase appVersionCode in app/build.gradle.kts."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -PgithubRepo=${{ github.repository }}

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing key secret is missing. Run Rebuild-APK.bat again."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PgithubRepo=${{ github.repository }}

      - name: Name APK and write checksum
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$SRC" "dist/${{ steps.ver.outputs.apk }}"
          cd dist
          sha256sum "${{ steps.ver.outputs.apk }}" > "${{ steps.ver.outputs.apk }}.sha256"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "dist/${{ steps.ver.outputs.apk }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "dist/${{ steps.ver.outputs.apk }}" \
            "dist/${{ steps.ver.outputs.apk }}.sha256" \
            --repo "${{ github.repository }}" \
            --title "Liquid Baby ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})" \
            --notes-file RELEASE_NOTES.md
