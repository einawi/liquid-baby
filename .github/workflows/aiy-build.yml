name: AIy build
# aiy-workflow v4
on:
  workflow_dispatch:
  push:
    paths:
      - '.aiy/build-request.txt'

concurrency:
  group: aiy-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - uses: gradle/actions/setup-gradle@v5
      - name: Use the signing key from GitHub Secrets
        # The key is read only from the AIY_KEYSTORE_BASE64 secret and is never committed.
        # If the secret is missing the build stops: a new key would give phones that already
        # have this app an update they cannot install.
        env:
          AIY_KEYSTORE_BASE64: ${{ secrets.AIY_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$AIY_KEYSTORE_BASE64" ]; then
            echo "::error::The AIY_KEYSTORE_BASE64 secret is missing. Add the signing key as this secret, then run the build again."
            exit 1
          fi
          echo "$AIY_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          echo "Using the signing key from the AIY_KEYSTORE_BASE64 secret."
      - name: Build the debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon assembleDebug --stacktrace; else gradle --no-daemon assembleDebug --stacktrace; fi
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
