name: AIy build
# aiy-workflow v4
on:
  workflow_dispatch:
  push:
    paths:
      - '.aiy/build-request.txt'

concurrency:
  group: aiy-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - uses: gradle/actions/setup-gradle@v5
      - name: Use the signing key from GitHub Secrets
        # Never stops the build. The key is read from the AIY_KEYSTORE_BASE64 secret and is never committed.
        continue-on-error: true
        env:
          AIY_KEYSTORE_BASE64: ${{ secrets.AIY_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$AIY_KEYSTORE_BASE64" ]; then
            echo "$AIY_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the signing key from the AIY_KEYSTORE_BASE64 secret."
          elif [ -f .aiy/debug.keystore ]; then
            cp .aiy/debug.keystore ~/.android/debug.keystore
            echo "::warning::Using the old key still stored in the repo. Put it in the AIY_KEYSTORE_BASE64 secret, then delete .aiy/debug.keystore."
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::A new signing key was created. Phones with older builds will not update over this build."
          fi
      - name: Build the debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon assembleDebug --stacktrace; else gradle --no-daemon assembleDebug --stacktrace; fi
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
