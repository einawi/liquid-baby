name: Kotlin version

# Manual only: prints the Kotlin library version the release build uses. Publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Print the Kotlin version
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath | grep -i "kotlin-stdlib" | head -n 5
          echo "--- Kotlin plugin version from the build ---"
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseCompileClasspath | grep -i "org.jetbrains.kotlin:kotlin-stdlib" | head -n 3
