name: TEMP recover key
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Decode the key from the secret
        env:
          AIY_KEYSTORE_BASE64: ${{ secrets.AIY_KEYSTORE_BASE64 }}
        run: |
          echo "$AIY_KEYSTORE_BASE64" | base64 -d > new-debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-key
          path: new-debug.keystore
          retention-days: 1
